# CI mínimo — Raio-X de set/2026, risco 09 ("zero CI").
#
# Roda a suíte do backend a cada push e a cada pull request. A suíte usa
# pg-mem: não precisa de Postgres nem de chave nenhuma. Se um teste quebrar,
# o check fica vermelho no PR e no commit de main.
#
# Deploy só com verde: na Railway, Settings → Deploy → "Wait for CI" faz o
# serviço esperar este check passar antes de publicar o commit de main.
# A proteção do branch main (GitHub → Settings → Branches → require status
# checks → "Testes do backend") impede o merge com o check vermelho.
# As duas configurações são feitas no painel, não neste arquivo.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Um push novo no mesmo branch cancela a execução anterior: só o último
# commit interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma versão do backend/Dockerfile (node:20-alpine).
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm test
        env:
          NODE_ENV: test
